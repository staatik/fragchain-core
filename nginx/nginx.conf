user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ----------------------------------------------------------------------
    # F-003 — keep WebSocket tickets / bearer tokens out of access logs.
    #
    # `$request_uri` includes the raw query string, which means a bearer
    # JWT or single-use ticket lands on disk every time. The two log
    # formats below split traffic:
    #
    #   * `json_safe`     — used by /ws/. Logs only `$uri`, stripping
    #                       query parameters entirely.
    #   * `json_combined` — used everywhere else. Keeps `$request_uri`
    #                       so normal API calls still log filter/order
    #                       params.
    #
    # Routes that pass secrets via query (none should exist outside the
    # WS path, but documented here as the rule) must use `json_safe`.
    # ----------------------------------------------------------------------
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"rt_ms":$request_time'
        '}';

    log_format json_safe escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"user_agent":"$http_user_agent",'
        '"rt_ms":$request_time'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 25m;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # ---- Rate limit zones ----
    limit_req_zone $binary_remote_addr zone=fragchain_api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=fragchain_auth:10m rate=5r/s;

    # ----------------------------------------------------------------------
    # F-007 — drive Upgrade negotiation through a single map so the header
    # only forwards on the explicit WebSocket location. Without this, a
    # client sending `Upgrade: h2c` to /api/ could try to influence the
    # upstream's protocol selection.
    # ----------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # ---- Security defaults (applied per-server) ----
    #
    # F-008 — CSP hardening.
    #
    # `script-src 'self'`: drop unsafe-inline. The Vite-built bundle
    # emits only hashed `<script type="module" src="...">` tags, so
    # 'self' is sufficient. If a future build step introduces inline
    # scripts, switch to a nonce; do NOT re-add 'unsafe-inline'.
    #
    # `style-src 'self' 'unsafe-inline'`: kept narrowly because the
    # React tree relies on a small number of inline style props (e.g.
    # dynamic color tokens in DarkOps). Tightening this further is
    # tracked as a follow-up — the inline scripts were the higher-
    # severity injection vector and they're fixed here.
    #
    # `frame-ancestors 'none'` + `object-src 'none'` close two common
    # iframe / embed attack surfaces.
    map $sent_http_content_type $csp_header {
        default "default-src 'self'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' wss: ws:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';";
    }

    include /etc/nginx/conf.d/*.conf;
}
