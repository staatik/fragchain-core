# =====================================================================
# FragChain reverse proxy vhost.
#
# F-007 hardening:
#
# * The catch-all `default_server` blocks below answer (with HTTP 444 →
#   "close connection without response") any request whose Host header
#   doesn't match a configured server_name. A request like
#   `Host: attacker.example` no longer produces a 301 redirect to
#   `https://attacker.example/`.
# * Operators set the real public host via the `server_name` directive
#   in the second pair of server blocks. The HTTPS redirect uses that
#   canonical host instead of `$host`, so HTTP→HTTPS redirects can no
#   longer be poisoned by a malicious Host header.
# * `Upgrade` is only forwarded inside the explicit /ws/ location.
#   Everywhere else `proxy_set_header Upgrade ""` strips it so an
#   attacker can't smuggle `Upgrade: h2c` past Nginx.
# =====================================================================

# ---- Default catch-all (HTTP) — refuses unknown Host values ----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ---- Default catch-all (HTTPS) — refuses unknown Host values ----
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fragchain.crt;
    ssl_certificate_key /etc/nginx/certs/fragchain.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

# ---- HTTP → HTTPS redirect (canonical host only) ----
#
# `server_name` lists every public hostname this deployment answers on.
# Operators should edit this to match their canonical domain (e.g.
# `fragchain.example.com`). Localhost stays in the list so developer
# workflows keep working out of the box.
#
# The redirect Location uses the canonical host, not `$host`, so an
# attacker cannot inject their own host into the redirect target.
server {
    listen 80;
    listen [::]:80;
    server_name fragchain.local localhost;

    # Canonical host used for redirects. Set once and reuse below.
    set $canonical_host "fragchain.local";

    location / {
        return 301 https://$canonical_host$request_uri;
    }
}

# ---- HTTPS vhost ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fragchain.local localhost;

    ssl_certificate     /etc/nginx/certs/fragchain.crt;
    ssl_certificate_key /etc/nginx/certs/fragchain.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp_header always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- Auth (stricter rate limit) ----
    location ~ ^/api/v1/auth/ {
        limit_req zone=fragchain_auth burst=10 nodelay;
        proxy_pass http://fragchain-api:8000;
        proxy_http_version 1.1;
        # F-007: never forward Upgrade outside the WS location.
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API ----
    location /api/ {
        limit_req zone=fragchain_api burst=40 nodelay;
        proxy_pass http://fragchain-api:8000;
        proxy_http_version 1.1;
        # F-007: never forward Upgrade outside the WS location.
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- WebSocket ----
    #
    # F-003: this location uses the `json_safe` log format so the
    # `?ticket=` query parameter is never written to the access log.
    # F-007: Upgrade only forwards here, gated by `$connection_upgrade`
    # which maps empty Upgrade headers to `close`.
    location /ws/ {
        access_log /var/log/nginx/access.log json_safe;
        proxy_pass http://fragchain-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- UI ----
    # fragchain-ui is nginx-unprivileged serving the built React bundle.
    # Listens on 8080 inside the container (non-privileged port required
    # by the unprivileged base image). All security headers (CSP, HSTS,
    # X-Frame-Options, etc.) are set here at the reverse-proxy layer;
    # the inner nginx only serves static files.
    location / {
        proxy_pass http://fragchain-ui:8080;
        proxy_http_version 1.1;
        # F-007: never forward Upgrade outside the WS location.
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
