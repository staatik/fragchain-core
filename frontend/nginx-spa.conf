# =====================================================================
# Static SPA server for fragchain-ui (production runtime).
#
# This server is internal — only the reverse-proxy nginx (the `nginx`
# service in docker-compose.yml) is exposed publicly. All TLS, security
# headers, rate limiting, and CSP enforcement live in the reverse proxy
# (`nginx/conf.d/fragchain.conf`). This vhost only:
#
#   1. Serves the pre-built React bundle in /usr/share/nginx/html.
#   2. Falls back to /index.html for any unknown path so client-side
#      routes (React Router) keep working on deep-link refresh.
#   3. Sets long-lived immutable caching for hashed asset filenames
#      and no-cache for index.html so a redeploy is picked up on the
#      next page load.
# =====================================================================

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't leak nginx version in error pages / Server header
    server_tokens off;

    # Gzip text assets so the reverse proxy isn't doing this twice.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;

    # Hashed asset filenames (Vite emits `assets/index-<hash>.js`) are
    # safe to cache forever — they change on every build.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Common favicon / robots paths that the SPA fallback shouldn't
    # rewrite to index.html — return 404 cleanly if missing.
    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =404; }

    # SPA fallback: serve the requested file/dir if it exists; otherwise
    # hand the request to index.html so React Router can resolve it.
    # index.html itself is short-cached so a deploy lands on the next
    # navigation, not after the browser cache eventually expires.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
